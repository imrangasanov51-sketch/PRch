<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вёрстка и валидация форм</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Регистрация</h1>
      <p>Заполните форму</p>
    </header>
    <main class="main">
      <form class="registration-form" id="registrationForm" novalidate>
        <fieldset class="form-section">
          <legend>Личная информация</legend>
          <div class="form-group">
            <label for="firstName" class="required">Имя</label>
            <input type="text" id="firstName" name="firstName" required minlength="2" maxlength="50" placeholder="Введите имя">
            <span class="error-message" id="firstNameError"></span>
          </div>
          <div class="form-group">
            <label for="email" class="required">Email</label>
            <input type="email" id="email" name="email" required placeholder="example@mail.com">
            <span class="error-message" id="emailError"></span>
          </div>
          <div class="form-group">
            <label for="password" class="required">Пароль</label>
            <input type="password" id="password" name="password" required minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$" placeholder="Не менее 8 символов">
            <span class="error-message" id="passwordError"></span>
          </div>
          <div class="form-group">
            <label for="confirmPassword" class="required">Подтверждение пароля</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Повторите пароль">
            <span class="error-message" id="confirmPasswordError"></span>
          </div>
          <div class="form-group">
            <label for="bio">О себе</label>
            <textarea id="bio" name="bio" rows="4" maxlength="500" placeholder="Расскажите о себе"></textarea>
            <div class="char-counter"><span id="charCount">0</span>/500</div>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="terms" name="terms" required>
              Я принимаю условия
            </label>
            <span class="error-message" id="termsError"></span>
          </div>
        </fieldset>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
          <button type="reset" class="btn btn-secondary">Очистить</button>
        </div>
      </form>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
