<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Layout</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grid-container">
    <header class="header"><h1>CSS Grid в действии</h1></header>
    <nav class="navigation">
      <h2>Навигация</h2>
      <ul>
        <li><a href="#">Главная</a></li>
        <li><a href="#">О нас</a></li>
        <li><a href="#">Услуги</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <article class="featured"><h2>Основной контент</h2><p>Главная статья</p></article>
      <section class="gallery">
        <div class="gallery-item">Изображение 1</div>
        <div class="gallery-item">Изображение 2</div>
        <div class="gallery-item">Изображение 3</div>
        <div class="gallery-item">Изображение 4</div>
      </section>
    </main>
    <aside class="sidebar"><h2>Боковая панель</h2><p>Доп. информация</p></aside>
    <footer class="footer">
      <div class="footer-section">Контакты</div>
      <div class="footer-section">Соцсети</div>
      <div class="footer-section">Партнёры</div>
      <div class="footer-section">Подписка</div>
    </footer>
  </div>
</body>
</html>
