<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обработка событий</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header id="main-header"><h1>ПР12: Обработка событий</h1></header>
    <section id="tasks-section">
      <div class="task-area" id="task1">
        <h3>Базовые обработчики</h3>
        <button id="basic-btn">Нажми меня</button>
        <div id="basic-output" class="output">Ожидание</div>
        <div class="color-box" id="color-box">Наведи курсор</div>
        <div id="mouse-output" class="output">Координаты:</div>
      </div>
      <div class="task-area" id="task2">
        <h3>Клавиатура</h3>
        <input type="text" id="key-input" placeholder="Печатайте...">
        <div id="key-output" class="output">Информация о клавишах</div>
      </div>
      <div class="task-area" id="task3">
        <h3>Делегирование</h3>
        <div class="item-list" id="item-list">
          <div class="item" data-id="1">Элемент 1 <span class="delete">X</span></div>
          <div class="item" data-id="2">Элемент 2 <span class="delete">X</span></div>
          <div class="item" data-id="3">Элемент 3 <span class="delete">X</span></div>
        </div>
        <button id="add-item-btn">Добавить</button>
        <div id="delegation-output" class="output">Выбранные:</div>
      </div>
      <div class="task-area" id="task4">
        <h3>Предотвращение</h3>
        <a href="https://example.com" id="prevent-link" class="prevent-link">Перейти</a>
        <form class="prevent-form" id="prevent-form">
          <input type="text" name="field" placeholder="Введите...">
          <button type="submit">Отправить</button>
        </form>
        <div id="prevention-output" class="output"></div>
      </div>
      <div class="task-area" id="task5">
        <h3>Кастомные события</h3>
        <button id="trigger-custom">Запустить</button>
        <button id="multiple-listeners">Несколько</button>
        <div id="custom-output" class="output">Ожидание</div>
      </div>
      <div class="task-area" id="task6">
        <h3>Загрузка</h3>
        <button id="load-image">Загрузить</button>
        <button id="load-error">Ошибка</button>
        <div id="image-container" class="image-container"></div>
        <div id="loading-output" class="output">Статус:</div>
      </div>
      <div class="task-area" id="task7">
        <h3>Таймеры</h3>
        <button id="start-timer">Запустить</button>
        <button id="stop-timer">Стоп</button>
        <button id="debounce-btn">Debounce</button>
        <button id="throttle-btn">Throttle</button>
        <div id="timer-output" class="output">Таймер: 0</div>
        <div id="async-output" class="output"></div>
      </div>
    </section>
    <footer id="main-footer"><p>Проверьте консоль</p></footer>
  </div>
  <script src="events-tasks.js"></script>
  <script src="events-tests.js"></script>
</body>
</html>
