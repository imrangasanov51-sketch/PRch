<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вёрстка по макету</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="#" class="logo"><span class="logo-text">Company</span></a>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="#home" class="nav-link">Главная</a></li>
          <li><a href="#about" class="nav-link">О нас</a></li>
          <li><a href="#services" class="nav-link">Услуги</a></li>
          <li><a href="#contact" class="nav-link">Контакты</a></li>
        </ul>
      </nav>
      <button class="cta-button">Связаться</button>
    </div>
  </header>
  <section class="hero" id="home">
    <div class="container">
      <div class="hero-content">
        <h1 class="hero-title">Создаём цифровые продукты</h1>
        <p class="hero-description">Помогаем бизнесу расти</p>
        <div class="hero-actions">
          <button class="btn btn-primary">Начать</button>
          <button class="btn btn-secondary">Узнать</button>
        </div>
      </div>
      <div class="hero-visual">
        <img src="https://via.placeholder.com/600x400" alt="Hero" class="hero-image">
      </div>
    </div>
  </section>
  <section class="features" id="services">
    <div class="container">
      <h2 class="section-title">Почему выбирают нас</h2>
      <div class="features-grid">
        <div class="feature-card"><div class="feature-icon">1</div><h3 class="feature-title">Скорость</h3><p class="feature-description">Быстрая разработка</p></div>
        <div class="feature-card"><div class="feature-icon">2</div><h3 class="feature-title">Качество</h3><p class="feature-description">Высокое качество</p></div>
        <div class="feature-card"><div class="feature-icon">3</div><h3 class="feature-title">Поддержка</h3><p class="feature-description">Постоянная поддержка</p></div>
      </div>
    </div>
  </section>
  <footer class="footer" id="contact"><div class="container"><p>&copy; 2024 Company</p></div></footer>
</body>
</html>
